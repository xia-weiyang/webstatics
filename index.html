<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            /* 避免滑动时选中文字/图片，提升手感 */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            /* 隐藏原生滚动条，全屏控制翻页 */
            font-family: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, 'Noto Sans', sans-serif;
            background-color: #000;
        }

        /* 主容器：全屏，滚动容器采用滚动捕捉 (scroll-snap) 实现顺滑上下滑动翻页 */
        .snap-container {
            height: 100vh;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            /* 平滑滚动提升体验 (iOS Safari 也良好支持) */
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            /* iOS 惯性滚动流畅 */
            position: relative;
        }

        /* 隐藏滚动条 (保持功能但更美观) */
        .snap-container::-webkit-scrollbar {
            display: none;
        }

        .snap-container {
            -ms-overflow-style: none;
            /* IE/Edge */
            scrollbar-width: none;
            /* Firefox */
        }

        /* 每个page即一屏画面 */
        .page {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            /* 强制停靠，避免快速滑动跳过多个 */
            position: relative;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            transition: background-image 0.2s ease;
        }

        /* 半透明遮罩层：用于增强文字/按钮可读性，但不影响滑动 */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            /* 柔和暗化，让白色文字和按钮更清晰 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 48px 24px 32px;
            pointer-events: none;
            /* 默认让遮罩不拦截点击，但按钮区域需要独立可点，按钮本身会设置 pointer-events: auto */
        }

        /* 顶部标题区样式 */
        .page-title {
            color: white;
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 60px;
            display: inline-block;
            pointer-events: none;
        }

        /* 底部滑动标识 (动态样式JS控制文字/箭头) */
        .scroll-indicator {
            position: absolute;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.3s ease;
            animation: gentleBounce 1.8s infinite ease-in-out;
        }

        .indicator-content {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 48px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            border: 0.5px solid rgba(255, 255, 255, 0.3);
        }

        .indicator-content span:first-child {
            font-size: 20px;
            font-weight: 300;
            display: block;
        }

        /* 箭头弹动动画 */
        @keyframes gentleBounce {
            0% {
                transform: translateY(0);
                opacity: 0.7;
            }

            50% {
                transform: translateY(6px);
                opacity: 1;
            }

            100% {
                transform: translateY(0);
                opacity: 0.7;
            }
        }

        /* 自定义按钮容器: 位于第三页的下方区域 (不干扰滑动标识, 且独立于遮罩层，可点击) */
        .custom-btn-wrapper {
            position: absolute;
            bottom: 90px;
            /* 位于滑动标识上方，视觉舒服 */
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: none;
            /* 容器不拦截，但里面的按钮可点 */
        }

        .jump-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            padding: 12px 32px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
            min-width: 160px;
            text-align: center;
            font-family: inherit;
        }

        .jump-btn:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
        }

        /* 针对只有第3页显示此按钮，其他页面隐藏 */
        .page:not(.has-special-btn) .custom-btn-wrapper {
            display: none;
        }

        /* 响应式微调 */
        @media (max-width: 480px) {
            .indicator-content {
                padding: 6px 16px;
                font-size: 11px;
            }

            .page-title {
                font-size: 1.4rem;
                padding: 6px 16px;
            }

            .jump-btn {
                padding: 10px 24px;
                font-size: 0.95rem;
                min-width: 140px;
            }

            .custom-btn-wrapper {
                bottom: 120px;
            }
        }

        /* 增加简单淡入效果 */
        .fade-in {
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="snap-container" id="snapContainer">
        <!-- 页面1: 壮丽山脉 -->
        <div class="page" id="page1" style="background-image: url('./img/01.png');">
            <!-- <div class="overlay">
            <div class="page-title">⛰️ 山川云海</div>
            <div></div>
        </div> -->
            <div class="scroll-indicator indicator-down">
                <div class="indicator-content">
                    <span>↓</span>
                    <span>Swipe down</span>
                </div>
            </div>
        </div>
        <!-- 页面2: 静谧海洋 -->
        <div class="page" id="page2" style="background-image: url('./img/02.png');">
            <!-- <div class="overlay">
            <div class="page-title">🌊 蔚蓝海岸</div>
            <div></div>
        </div> -->
            <div class="scroll-indicator indicator-down">
                <div class="indicator-content">
                    <span>↓</span>
                    <span>Swipe down</span>
                </div>
            </div>
        </div>
        <!-- 页面3: 摩登都市 -->
        <div class="page" id="page3" style="background-image: url('./img/03.png');">
            <!-- <div class="overlay">
            <div class="page-title">🌃 璀璨都市</div>
            <div></div>
        </div> -->
            <!-- 半透明跳转按钮区域 (位于图片下方区域，底部滑动标识上方，视觉分明) -->
            <div class="custom-btn-wrapper" style="display: flex;">
                <button class="jump-btn" id="openAppBtn">Open</button>
            </div>
            <div class="scroll-indicator indicator-down">
                <div class="indicator-content">
                    <span>↓</span>
                    <span>Swipe down</span>
                </div>
            </div>
        </div>
        <!-- 页面4: 神秘森林 -->
        <div class="page" id="page4" style="background-image: url('./img/04.png');">
            <!-- <div class="overlay">
            <div class="page-title">🍃 绿野仙踪</div>
            <div></div>
        </div> -->
            <div class="scroll-indicator indicator-down">
                <div class="indicator-content">
                    <span>↓</span>
                    <span>Swipe down</span>
                </div>
            </div>
        </div>
        <!-- 页面5: 璀璨星河 最后一屏 -->
        <div class="page" id="page5" style="background-image: url('./img/05.png');">
            <!-- <div class="overlay">
            <div class="page-title">✨ 银河星野</div>
            <div></div>
        </div> -->
            <!-- 最后一页底部标识：动态JS会改变成向上滑动或保留? 但为了满足始终出现滑动指引，将会变成 "向上滑动" 或返回顶部样式，文案变化，依然属于滑动标识，但明确告诉用户可以向上返回；不失优雅且符合交互 -->
            <div class="scroll-indicator indicator-up" id="lastIndicator">
                <div class="indicator-content">
                    <span>↑</span>
                    <span>Swipe up</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // 获取滚动容器和所有页面
            const container = document.getElementById('snapContainer');
            const pages = document.querySelectorAll('.page');
            const totalPages = pages.length;

            // 存储每个page对应的指示器对象 (主要是前4个向下标识和最后一个向上标识)
            // 但是为了方便在每次滚动时动态更新底部标识文案/图标，根据当前可视区域是第几屏来决定指示器显示内容。
            // 需求：要求页面底部始终有个滑动标识(向下滑动明确)，但在最后一页如果用户看见向下但不能滑动会产生困惑，因此逻辑:
            // - 当前页如果不是最后一页，底部标识显示「向下滑动」箭头向下。
            // - 当前页是最后一页，底部标识改成「向上滑动」箭头向上(且依然在底部，起到引导返回作用)。
            // - 同时如果滚动到顶部第一屏，向上滑动是否要额外加? 无需，但用户向上滑动会到顶，但不是重点，第一屏依然显示向下标识即可（因为还可以向下）。
            // 完美实现滑动标识动态更新，体验一致。

            // 此外，考虑到首屏加载时也符合预期，在滚动过程中根据当前处于哪个page来更新所有可见标识（但每个页面有自己的指示器，我们只需要确保每个页面显示的指示器符合当前页面在整体中的位置？
            // 但最好是每个页面都带有自己的指示器，且每个指示器的内容根据该页索引动态改变（因为滚动到最后一屏时最后一屏显示向上，其他屏显示向下）这样无需频繁操作多个，只需要滚动时批量更新所有指示器状态。
            // 这样更通用，也符合直觉（用户看到当前屏幕底部指示告诉下一步操作）。

            // 获取所有指示器元素（每个.page里面的.scroll-indicator）
            const indicators = document.querySelectorAll('.scroll-indicator');

            // 更新所有指示器显示状态：基于传入的当前活动页索引(0-based)
            function updateAllIndicators(activeIndex) {
                indicators.forEach((indicator, idx) => {
                    // 每个指示器对应的page索引与指示器所在父级.page索引一致
                    const parentPage = indicator.closest('.page');
                    if (!parentPage) return;
                    const pageIdx = Array.from(pages).indexOf(parentPage);
                    if (pageIdx === -1) return;

                    // 获取指示器内部的内容区域
                    const contentDiv = indicator.querySelector('.indicator-content');
                    if (!contentDiv) return;

                    const arrowSpan = contentDiv.querySelector('span:first-child');
                    const textSpan = contentDiv.querySelector('span:last-child');

                    if (pageIdx === totalPages - 1) {
                        // 最后一页总是显示向上滑动 (让用户可返回)
                        if (arrowSpan) arrowSpan.innerHTML = '↑';
                        if (textSpan) textSpan.innerText = 'Swipe up';
                        // 加一点小反弹动画重置 无妨
                    } else {
                        // 非最后一页: 显示向下滑动
                        if (arrowSpan) arrowSpan.innerHTML = '↓';
                        if (textSpan) textSpan.innerText = 'Swipe down';
                    }

                    // 额外高级体验: 如果是当前激活页且非最后一页，可以略微强调? 不用变动太大
                    // 但为了让底部标识在当前屏看起来明显，可微调不透明度
                    if (pageIdx === activeIndex) {
                        indicator.style.opacity = '1';
                    } else {
                        // 非当前屏指示器透明度降低(由于滚动捕捉特性，只有当前屏在视口，其实不会有其他屏可见，但以防万一)
                        indicator.style.opacity = '0.9';
                    }
                    // 确保可见
                    indicator.style.visibility = 'visible';
                });
            }

            // 获取当前视口中哪个页面处于活动(根据滚动容器的scrollTop和每个page的offsetTop)
            function getCurrentActivePageIndex() {
                const scrollTop = container.scrollTop;
                // 使用page元素位置计算
                for (let i = 0; i < pages.length; i++) {
                    const page = pages[i];
                    const offsetTop = page.offsetTop;
                    const height = page.clientHeight;
                    // 如果滚动位置落在page区域内 (加容差更稳定)
                    if (scrollTop >= offsetTop - height * 0.2 && scrollTop < offsetTop + height - height * 0.2) {
                        return i;
                    }
                }
                // 降级: 最后一个边界情况处理 (滑到底部)
                if (scrollTop + container.clientHeight >= container.scrollHeight - 5) {
                    return totalPages - 1;
                }
                return 0;
            }

            // 滚动事件处理 (防抖用于性能)
            let ticking = false;
            function onScrollHandler() {
                if (!ticking) {
                    requestAnimationFrame(() => {
                        const activeIdx = getCurrentActivePageIndex();
                        updateAllIndicators(activeIdx);
                        ticking = false;
                    });
                    ticking = true;
                }
            }

            // 初始更新一次
            function initUpdate() {
                // 确保滚动位置为0，首页激活
                container.scrollTo({ top: 0, behavior: 'instant' });
                const initialIdx = getCurrentActivePageIndex();
                updateAllIndicators(initialIdx);
            }

            // 添加滚动监听
            container.addEventListener('scroll', onScrollHandler);
            // 窗口大小改变可能导致offsetTop变化，重新更新当前激活页和指示器
            window.addEventListener('resize', () => {
                // 重新计算当前激活索引并更新指示器
                const activeIdx = getCurrentActivePageIndex();
                updateAllIndicators(activeIdx);
            });

            // 额外优化： 在触摸结束或滚动捕捉稳定后再次确保当前激活指示器正确（scroll结束保险）
            let scrollEndTimer;
            container.addEventListener('scrollend', () => {
                const activeIdx = getCurrentActivePageIndex();
                updateAllIndicators(activeIdx);
            });
            container.addEventListener('touchend', () => {
                clearTimeout(scrollEndTimer);
                scrollEndTimer = setTimeout(() => {
                    const activeIdx = getCurrentActivePageIndex();
                    updateAllIndicators(activeIdx);
                }, 50);
            });

            // 调用初始化
            initUpdate();

            // 可选: 轻量预加载背景图片，让切换更平滑 (预加载图片)
            function preloadImages() {
                const bgImages = [
                    './img/01.png',
                    './img/02.png',
                    './img/03.png',
                    './img/04.png',
                    './img/05.png'
                ];
                bgImages.forEach(src => {
                    const img = new Image();
                    img.src = src;
                });
            }
            preloadImages();

            // Android APP跳转功能
            const openAppBtn = document.getElementById('openAppBtn');
            if (openAppBtn) {
                openAppBtn.addEventListener('click', function() {
                    console.log('点击打开APP');
                    const appScheme = 'myapp://hotel'; // 替换为实际的APP URL Scheme
                    window.location.href = appScheme;
                });
            }

            // 附加小优化：确保滚动捕捉位置完美，偶尔iOS滑动停止位置不精确时可调用(无需额外)
            // 实现用户手指滑动后稳固吸附: 原生scroll-snap-type已经做了完美停靠，无需额外代码。
            // 对于某些浏览器边界，增加样式强制滚动容器高度精准
            // 另外针对最后一屏向上滑动需求，增加一个小辅助: 当用户滑到最后一屏时，如果继续向下拖动会有弹性，但滚动捕捉会停在最后一屏；
            // 此时指示器已经变成「向上滑动」，用户向上滑动自然就回到上一屏，体验完整。
            // 额外为了满足「页面底部有个向下滑动的标识」在非末屏存在，末屏合理变化为向上满足易用性。

            // 因为有时候最后一屏原本的指示器由于初始化已经变更，用户滚动时更新顺利。且所有屏标识反应明确。
            // 此外为了确保从末屏向上滑动后，前面的标识变回向下指示，已通过更新逻辑保证。
            // 加上非常优雅的动画和UI，完全符合需求。

            // 极个别情况: 如果用户快速滑动到底部或顶部，滚动捕捉完成后更新页面指示器。
            // 最后提供优雅的整体视觉。
            console.log('手机全屏滑动页面已启动 | 5张背景图+底部动态滑动标识');
        })();
    </script>
</body>

</html>
